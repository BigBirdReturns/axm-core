name: AP-410 dispatch v3 Windows cmd preflight

on:
  pull_request:
    paths:
      - '.github/workflows/ap410-dispatch-v3-windows-cmd-preflight.yml'
      - '.github/ap410-dispatch-v3-windows-cmd-preflight/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-cmd-preflight:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out preflight carrier
        uses: actions/checkout@v4

      - name: Install admitted Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Exercise launcher semantics through cmd.exe
        shell: pwsh
        run: .github/ap410-dispatch-v3-windows-cmd-preflight/preflight.ps1

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ap410-dispatch-v3-windows-cmd-preflight
          path: ${{ runner.temp }}/AP410 Dispatch Probe With Spaces/**
          if-no-files-found: error
          retention-days: 30
