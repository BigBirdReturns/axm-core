[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axm-core"
version = "1.1.0"
description = "AXM orchestration hub: CLI host, Forge ingestion, Spectra query engine"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
  # ── Protocol kernel ────────────────────────────────────────────────────────
  # Pinned to the v1 kernel commit (RFC 0002 — the v1.0 reset: one axm-hybrid1
  # suite, canonical JSONL core tables, derived shard identity) that also
  # carries the boundary drift-check the CI sources — the same commit the
  # spokes pin. Re-pin to the PyPI release range `>=1.0.0,<2` at v1.0.0.
  "axm-genesis @ git+https://github.com/BigBirdReturns/axm-genesis.git@9074e7fb2e9cedde692b248cdd0c6a805e77d8ac",

  # ── Core deps ─────────────────────────────────────────────────────────────
  "blake3>=0.4.0",
  "duckdb>=1.0.0",
  "pyarrow>=14.0.0",
  "pandas>=2.0.0",
  "click>=8.1.0",
  "cryptography>=41.0.0",
  "PyNaCl>=1.5.0",
  "PyMuPDF>=1.23.0",
  "pysbd>=0.3.4",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.100",
  "pydantic>=2.0",
]
# ML-DSA-44 signing backends, mirroring the axm-genesis extras rename:
# [mldsa] = liboqs (C bindings, preferred), [mldsa-compat] = dilithium-py
# (pure Python). "pq" is the deprecated old name for [mldsa-compat].
mldsa = [
  "liboqs-python",
]
mldsa-compat = [
  "dilithium-py>=0.5.0",
]
pq = [
  "dilithium-py>=0.5.0",
]
dev = [
  "pytest>=7.0",
  "dilithium-py>=0.5.0",
]

# ── Entry points ──────────────────────────────────────────────────────────────
# `axm` is the unified CLI host.  Spokes attach via axm.spokes entry-point group.
# `axm-forge` is the ingestion CLI, kept as its own command for direct use.
[project.scripts]
axm       = "axm_core.cli:main"
axm-forge = "axm_forge.cli.main:main"
axm-exit  = "foundry_exit.run_ontology_exit:main"
axm-pipeline-exit = "foundry_exit.run_pipeline_exit:main"

# ── Package discovery ─────────────────────────────────────────────────────────
# axm-core owns:
#   axm_core/        the CLI host and plugin discovery (src/axm_core/)
#   axm_forge/       ingestion + extraction (forge/axm_forge/)
#   axiom_runtime/   Spectra query engine (spectra/axiom_runtime/)
#
# clarion is a separate install target (clarion/pyproject.toml) because it has
# its own crypto deps (graphkdf) that not all users need.
#
# Setuptools resolves packages from multiple source roots via package-dir.
[tool.setuptools]
package-dir = {"" = ".", "axm_core" = "src/axm_core", "axm_forge" = "forge/axm_forge", "axiom_runtime" = "spectra/axiom_runtime"}

[tool.setuptools.packages.find]
where = [".", "forge", "spectra", "src"]
include = ["axm_core*", "axm_forge*", "axiom_runtime*", "foundry_exit*"]
