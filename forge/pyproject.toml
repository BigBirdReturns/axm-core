[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axm-forge"
version = "2.0.0"
description = "AXM Forge - ingestion + claim extraction + Clarion transport"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=41.0.0",
  "pyyaml>=6.0",
  "pysbd>=0.3.4",
]

[project.optional-dependencies]
# graphkdf is not published on PyPI; Clarion encryption support is opt-in.
kdf = [
  "graphkdf>=1.0.0",
]
full = [
  "duckdb>=0.9.0",
]

[project.scripts]
axm-forge = "axm_forge.cli.main:main"

# forge/ also contains non-package directories (inputs/, scripts/), so package
# discovery must be pinned to axm_forge or setuptools rejects the flat layout.
[tool.setuptools.packages.find]
include = ["axm_forge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
